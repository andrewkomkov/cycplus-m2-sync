# SwiftLint для ios/: MegaLinter запускает его с настройками по умолчанию, и ошибкой там считаются
# однобуквенные имена. Для координат раскладки и символа 'C' из протокола YMODEM это обычные имена,
# длинные только запутали бы код.
identifier_name:
  excluded:
    - x
    - y
    - c

excluded:
  - ios/build
  - ios/M2Sync.xcodeproj
