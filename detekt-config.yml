# Правится поверх дефолтной конфигурации detekt (--build-upon-default-config),
# поэтому здесь только отклонения от неё.

naming:
  FunctionNaming:
    # В Compose функции-компоненты по конвенции пишутся с заглавной буквы.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Протокол CycPlus M2 и формат FIT — это байтовые константы, смещения и
    # идентификаторы полей. Именовать каждое число здесь только зашумляет код.
    active: false
