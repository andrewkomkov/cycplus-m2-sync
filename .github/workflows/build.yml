name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Проверяем контрольную сумму gradle-wrapper.jar: подменённый враппер —
      # известный вектор атаки на цепочку сборки.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # Экранные тесты идут на Robolectric, эмулятор для них не нужен.
      - name: Unit and UI tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest

      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: m2sync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      # Полная история: по shallow-клону Sonar не разложит изменения по авторам
      # и не отделит новый код от старого.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r tools/requirements.txt

      - name: Byte-compile
        run: python -m compileall -q tools

      - name: CLI help works
        working-directory: tools
        run: python m2_cli.py --help
