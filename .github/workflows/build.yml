name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

# Без явного блока токен job'а получает write-доступ по умолчанию настроек репозитория.
permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Проверяем контрольную сумму gradle-wrapper.jar: подменённый враппер —
      # известный вектор атаки на цепочку сборки.
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Экранные тесты идут на Robolectric, эмулятор для них не нужен.
      - name: Unit and UI tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-report
          path: android/app/build/reports/tests/testDebugUnitTest

      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2sync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Прогонам dependabot GitHub подставляет не секреты Actions, а отдельное
    # хранилище Dependabot secrets: SONAR_TOKEN там пуст, и сканер падает на
    # каждом бампе версии. Проверять в таком дифе всё равно нечего.
    if: github.actor != 'dependabot[bot]'
    steps:
      # Полная история: по shallow-клону Sonar не разложит изменения по авторам
      # и не отделит новый код от старого.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Без отчёта JaCoCo Sonar считает покрытие нулевым и валит quality gate.
      - name: Coverage report
        working-directory: android
        run: ./gradlew :app:jacocoTestReport --no-daemon

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r tools/requirements.txt

      - name: Byte-compile
        run: python -m compileall -q tools

      - name: CLI help works
        working-directory: tools
        run: python m2_cli.py --help
