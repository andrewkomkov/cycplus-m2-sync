name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Проверяем контрольную сумму gradle-wrapper.jar: подменённый враппер —
      # известный вектор атаки на цепочку сборки.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: m2sync-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r tools/requirements.txt

      - name: Byte-compile
        run: python -m compileall -q tools

      - name: CLI help works
        working-directory: tools
        run: python m2_cli.py --help
