name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Раз в неделю — чтобы ловить новые правила, а не только новый код.
    - cron: '32 4 * * 1'

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # java-kotlin отключён: анализатор обрывает компиляцию с «Kotlin version
          # 2.4.10 is too recent, CodeQL currently supports versions below 2.4.10»,
          # а тулчейн держим актуальным. Вернуть вместе с шагами сборки, когда
          # CodeQL догонит: language java-kotlin, build-mode manual, setup-java 17,
          # setup-gradle и ./gradlew :app:assembleDebug в android/.
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
