name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Раз в неделю — чтобы ловить новые правила, а не только новый код.
    - cron: '32 4 * * 1'

# Job поднимает права до security-events сам, остальному workflow нужно чтение.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # java-kotlin отключён: анализатор обрывает компиляцию с «Kotlin version
          # 2.4.10 is too recent, CodeQL currently supports versions below 2.4.10»,
          # а тулчейн держим актуальным. Вернуть вместе с шагами сборки, когда
          # CodeQL догонит: language java-kotlin, build-mode manual, setup-java 17,
          # setup-gradle и ./gradlew :app:assembleDebug в android/.
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:${{ matrix.language }}
