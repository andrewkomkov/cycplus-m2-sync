name: MegaLinter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Сводку прогона MegaLinter кладёт комментарием в PR.
  pull-requests: write
  # SARIF-отчёт уезжает в code scanning.
  security-events: write

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      # Полная история: без неё линтер не разложит замечания по базе сравнения.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Образ по умолчанию, без flavor: в репозитории и Kotlin, и Python —
      # ни один узкий flavor их вместе не покрывает.
      - uses: oxsecurity/megalinter@v9
        id: megalinter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
