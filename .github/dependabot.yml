version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      androidx:
        patterns: ['androidx.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
    ignore:
      # Свежие androidx требуют compileSdk 37, а платформы android-37 в
      # репозитории Google ещё нет — вернуться, когда появится.
      - dependency-name: 'androidx.core:core-ktx'
        versions: ['>=1.16.0']
      - dependency-name: 'androidx.activity:*'
        versions: ['>=1.10.0']
      - dependency-name: 'androidx.lifecycle:*'
        versions: ['>=2.9.0']
      # AGP 9 и Gradle 9 идут в одной связке с тем же compileSdk 37.
      - dependency-name: 'com.android.application'
        update-types: ['version-update:semver-major']
      - dependency-name: 'gradle'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    commit-message:
      prefix: build
