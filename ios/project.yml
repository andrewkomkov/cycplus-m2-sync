name: M2Sync
options:
  bundleIdPrefix: dev.komkov
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

packages:
  FITSwiftSDK:
    url: https://github.com/garmin/fit-swift-sdk
    exactVersion: 21.214.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.1" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"

targets:
  M2Sync:
    type: application
    platform: iOS
    sources: [M2Sync]
    dependencies:
      - package: FITSwiftSDK
    entitlements:
      path: M2Sync/M2Sync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: M2Sync/Info.plist
      properties:
        CFBundleDisplayName: M2 Sync
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Downloads rides from the bike computer over Bluetooth.
        NSHealthUpdateUsageDescription: Saves rides as cycling workouts with route, heart rate, cadence, speed and active energy.
        NSHealthShareUsageDescription: Reads weight, date of birth and sex for the calorie estimate, and checks which rides are already in Apple Health.
        # Передача не рвётся, если iPhone заблокировали посреди синка.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.komkov.m2sync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Команду подписи не храним в публичном репозитории: выбирается в Xcode
        # или передаётся в xcodebuild как DEVELOPMENT_TEAM=<id>.

  M2SyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: [M2SyncTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: M2Sync
      - package: FITSwiftSDK

schemes:
  M2Sync:
    build:
      targets:
        M2Sync: all
    test:
      targets: [M2SyncTests]
