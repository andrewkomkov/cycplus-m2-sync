sonar.projectKey=andrewkomkov_cycplus-m2-sync
sonar.organization=andrewkomkov

sonar.sources=android/app/src/main,tools
sonar.tests=android/app/src/test

sonar.sourceEncoding=UTF-8

# Без явной версии Sonar анализирует код как совместимый со всеми Python 3
# и теряет часть правил. Держим в одной версии с job'ом tools в build.yml.
sonar.python.version=3.12

# Сборочные артефакты и клоны чужих репозиториев (см. .gitignore) в анализ не идут.
sonar.exclusions=**/build/**,cycsync/**,xoss_sync/**,**/__pycache__/**
