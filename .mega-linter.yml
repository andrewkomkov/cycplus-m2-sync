# Полная раскладка линтеров MegaLinter: Kotlin, Python, YAML/JSON/XML, Markdown,
# GitHub Actions, secrets и SCA. Список включённых линтеров не сужаем — что
# сработало лишним, глушим точечно ниже.

APPLY_FIXES: none
VALIDATE_ALL_CODEBASE: true
SHOW_ELAPSED_TIME: true

# Клоны чужих репозиториев (см. .gitignore), сборочные артефакты, вендорный
# gradle-враппер и генерируемый release-please changelog — не наш код.
FILTER_REGEX_EXCLUDE: '(^|/)(cycsync|xoss_sync|\.venv|__pycache__)/|/build/|^android/gradlew|^CHANGELOG\.md$'

DISABLE:
  # README и docs двуязычные, словарь пришлось бы вести под русский текст и
  # велосипедные термины вроде FIT, XOSS, CycPlus — сплошные ложные срабатывания.
  - SPELL

DISABLE_LINTERS:
  # Ходит по внешним ссылкам на каждом прогоне — падения от чужого downtime.
  - MARKDOWN_MARKDOWN_LINK_CHECK

# Без токена zizmor не может резолвить ref'ы экшенов через GitHub API и падает
# на самом первом `uses:`, так и не выполнив ни одной проверки.
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN

# DS137138 «Insecure URL» ловит http://schemas.android.com/apk/res/android в
# каждом ресурсном XML. Это XML-namespace, а не адрес, по которому куда-то ходят.
REPOSITORY_DEVSKIM_ARGUMENTS:
  - --ignore-rule-ids
  - DS137138

# detekt по умолчанию заменяет всю конфигурацию файлом из --config, поэтому без
# --build-upon-default-config от набора правил осталось бы два переопределения.
# Baseline замораживает накопленную сложность: старое не мешает, новое ловится.
KOTLIN_DETEKT_ARGUMENTS:
  - --build-upon-default-config
  - --baseline
  - detekt-baseline.xml

# На пороге в 50 токенов jscpd считает клонами блоки импортов Compose в начале
# файлов. Поднимаем до объёма, на котором дублирование действительно значимо.
COPYPASTE_JSCPD_ARGUMENTS:
  - --min-tokens
  - '100'

# В образе линтера нет bleak и fitdecode, без них pylint и pyright сыпят
# import-error на каждый импорт tools/ вместо настоящих замечаний.
# Путь абсолютный: pylint ставится из своего venv, cwd там уже не workspace.
PRE_COMMANDS:
  - command: pip install --break-system-packages -r tools/requirements.txt
    cwd: workspace
    run_before_linters: true
  - command: pip install -r "$DEFAULT_WORKSPACE/tools/requirements.txt"
    cwd: workspace
    venv: pylint
    run_before_linters: true

# Отчёты складываем артефактом workflow, сводку — комментарием в PR.
SARIF_REPORTER: true
TEXT_REPORTER: true
